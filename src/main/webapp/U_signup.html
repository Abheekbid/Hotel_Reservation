<!DOCTYPE html>
<html>
<head>
    <title>Hotel Reservation - Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #10141F;
            --panel: #171C29;
            --panel-line: #2A3143;
            --brass: #C6A15B;
            --brass-soft: rgba(198, 161, 91, 0.35);
            --parchment: #EDE7DA;
            --slate: #8890A3;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: var(--ink);
            background-image:
                radial-gradient(circle at 12% 8%, rgba(198,161,91,0.06), transparent 40%),
                radial-gradient(circle at 88% 92%, rgba(198,161,91,0.05), transparent 40%);
            font-family: 'Work Sans', sans-serif;
            color: var(--parchment);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--panel);
            border: 1px solid var(--panel-line);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
            position: relative;
        }

        /* magnetic-stripe signature bar, like a key card */
        .stripe {
            height: 46px;
            background: repeating-linear-gradient(
                100deg,
                #0B0E16,
                #0B0E16 3px,
                #171C29 3px,
                #171C29 6px
            );
            border-bottom: 1px solid var(--panel-line);
            position: relative;
        }

        .stripe::after {
            content: "";
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-family: 'Work Sans', sans-serif;
            font-size: 10px;
            letter-spacing: 0.14em;
            color: var(--slate);
        }

        .head {
            padding: 30px 34px 4px;
        }

        .eyebrow {
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--brass);
            margin: 0 0 10px;
        }

        h2 {
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-size: 30px;
            line-height: 1.15;
            margin: 0 0 8px;
            color: var(--parchment);
        }

        .sub {
            font-size: 13.5px;
            color: var(--slate);
            margin: 0 0 26px;
            line-height: 1.5;
        }

        form {
            padding: 4px 34px 34px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 11.5px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--slate);
            margin-bottom: 7px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        textarea {
            width: 100%;
            background: #0D1119;
            border: 1px solid var(--panel-line);
            border-radius: 7px;
            padding: 12px 13px;
            font-family: 'Work Sans', sans-serif;
            font-size: 14.5px;
            color: var(--parchment);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        textarea {
            resize: vertical;
            min-height: 64px;
            line-height: 1.5;
        }

        input::placeholder,
        textarea::placeholder {
            color: #545C6E;
        }

        input:focus,
        textarea:focus {
            border-color: var(--brass);
            box-shadow: 0 0 0 3px var(--brass-soft);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: var(--brass);
            color: #171208;
            font-family: 'Work Sans', sans-serif;
            font-weight: 600;
            font-size: 14.5px;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.05s ease;
        }

        button:hover { background: #D4B06E; }
        button:active { transform: translateY(1px); }

        .foot {
            text-align: center;
            font-size: 12.5px;
            color: var(--slate);
            margin-top: 18px;
        }

        .foot a {
            color: var(--brass);
            text-decoration: none;
            border-bottom: 1px solid var(--brass-soft);
        }

        @media (max-width: 420px) {
            .row { grid-template-columns: 1fr; }
            .head, form { padding-left: 24px; padding-right: 24px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="stripe"></div>

        <div class="head">
            <p class="eyebrow">WayToGo Hotels &middot; Guest Registration</p>
            <h2>Create your guest&nbsp;profile</h2>
            <p class="sub">A few details and your key is ready. Used for reservations, folio history, and checkout.</p>
        </div>

        <form action="Usignup" method="post">

            <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" placeholder="As it appears on ID" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" required>
            </div>

            <div class="field">
                <label for="contact">Contact number</label>
                <input type="text" id="contact" name="contact" placeholder="Mobile number">
            </div>

            <div class="field">
                <label for="address">Address</label>
                <textarea id="address" name="address" placeholder="Street, city, state"></textarea>
            </div>

            <button type="submit">Sign up</button>

            <p class="foot">Already have a profile? <a href="login.html">Sign in</a></p>

        </form>
    </div>

</body>
</html>
