<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WayToGo Hotels — Guest Sign In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #10141F;
            --panel: #171C29;
            --panel-line: #2A3143;
            --brass: #C6A15B;
            --brass-soft: rgba(198, 161, 91, 0.35);
            --parchment: #EDE7DA;
            --slate: #8890A3;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: var(--ink);
            background-image:
                radial-gradient(circle at 12% 8%, rgba(198,161,91,0.06), transparent 40%),
                radial-gradient(circle at 88% 92%, rgba(198,161,91,0.05), transparent 40%);
            font-family: 'Work Sans', sans-serif;
            color: var(--parchment);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: var(--panel);
            border: 1px solid var(--panel-line);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
        }

        .stripe {
            height: 46px;
            background: repeating-linear-gradient(
                100deg,
                #0B0E16,
                #0B0E16 3px,
                #171C29 3px,
                #171C29 6px
            );
            border-bottom: 1px solid var(--panel-line);
        }

        .head { padding: 30px 34px 4px; }

        .eyebrow {
            font-size: 11px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--brass);
            margin: 0 0 10px;
        }

        h2 {
            font-family: 'Fraunces', serif;
            font-weight: 500;
            font-size: 30px;
            line-height: 1.15;
            margin: 0 0 8px;
            color: var(--parchment);
        }

        .sub {
            font-size: 13.5px;
            color: var(--slate);
            margin: 0 0 26px;
            line-height: 1.5;
        }

        form { padding: 4px 34px 34px; }

        .field { margin-bottom: 18px; }

        label {
            display: block;
            font-size: 11.5px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--slate);
            margin-bottom: 7px;
        }

        .required-mark { color: var(--brass); }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            background: #0D1119;
            border: 1px solid var(--panel-line);
            border-radius: 7px;
            padding: 12px 13px;
            font-family: 'Work Sans', sans-serif;
            font-size: 14.5px;
            color: var(--parchment);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input::placeholder { color: #545C6E; }

        input:focus {
            border-color: var(--brass);
            box-shadow: 0 0 0 3px var(--brass-soft);
        }

        input.invalid {
            border-color: #B4694F;
            box-shadow: 0 0 0 3px rgba(180, 105, 79, 0.25);
        }

        .err-msg {
            font-size: 11.5px;
            color: #C98771;
            margin: -10px 0 10px;
            display: none;
        }

        .err-msg.show { display: block; }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: var(--brass);
            color: #171208;
            font-family: 'Work Sans', sans-serif;
            font-weight: 600;
            font-size: 14.5px;
            cursor: pointer;
            transition: background 0.15s ease, transform 0.05s ease;
        }

        button:hover { background: #D4B06E; }
        button:active { transform: translateY(1px); }

        .foot {
            text-align: center;
            font-size: 12.5px;
            color: var(--slate);
            margin-top: 18px;
        }

        .foot a {
            color: var(--brass);
            text-decoration: none;
            border-bottom: 1px solid var(--brass-soft);
        }

        @media (max-width: 420px) {
            .head, form { padding-left: 24px; padding-right: 24px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="stripe"></div>
        <div class="head">
            <p class="eyebrow">WayToGo Hotels &middot; Guest Access</p>
            <h2>Welcome back</h2>
            <p class="sub">Sign in to your guest profile to browse and book properties.</p>
        </div>

        <form id="signinForm" action="Usignin" method="post">

            <div class="field">
                <label for="email">Email <span class="required-mark">*</span></label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
                <span class="err-msg"></span>
            </div>

            <div class="field">
                <label for="password">Password <span class="required-mark">*</span></label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <span class="err-msg"></span>
            </div>

            <button type="submit">Sign in</button>

            <p class="foot">New here? <a href="U_signup.html">Create a profile</a></p>

        </form>
    </div>

<script>
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    document.getElementById('signinForm').addEventListener('submit', function(e) {
        let valid = true;

        this.querySelectorAll('input[required]').forEach(f => {
            const err = f.parentElement.querySelector('.err-msg');
            if (!f.value.trim()) {
                f.classList.add('invalid');
                if (err) { err.textContent = 'This field is required.'; err.classList.add('show'); }
                valid = false;
            } else {
                f.classList.remove('invalid');
                if (err) err.classList.remove('show');
            }
        });

        const emailField = document.getElementById('email');
        const emailErr = emailField.parentElement.querySelector('.err-msg');
        if (emailField.value.trim() && !emailRegex.test(emailField.value.trim())) {
            emailField.classList.add('invalid');
            if (emailErr) { emailErr.textContent = 'Enter a valid email address.'; emailErr.classList.add('show'); }
            valid = false;
        }

        if (!valid) e.preventDefault();
    });
</script>

</body>
</html>
